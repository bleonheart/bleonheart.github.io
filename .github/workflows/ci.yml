name: ci

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate generated portfolio
        shell: bash
        run: |
          games=(
            tetris.js pong.js minesweeper.js solitaire.js snake.js breakout.js asteroids.js
            sokoban.js chess.js pinball.js memory.js lunar-lander.js epoch-siege.js
          )
          programs=(browser.js creations.js lilia.js recycle-bin.js reviews.js)
          test -s docs/index.html
          test -s docs/.nojekyll
          test -s docs/modules.json
          test -s docs/reviews.json
          test -s docs/github-stats.json
          test -s docs/derma-creator/index.html
          test -d docs/derma-creator/assets
          grep -q 'src="./assets/' docs/derma-creator/index.html
          grep -q 'href="./assets/' docs/derma-creator/index.html
          test -s derma-creator/index.html
          test -d derma-creator/assets
          for base in assets/javascript docs/assets/javascript; do
            test -s "$base/desktop.js"
            test -s "$base/site.js"
            test -s "$base/persistent-audio.js"
            for file in "${games[@]}"; do
              test -s "$base/games/$file"
            done
            for file in "${programs[@]}"; do
              test -s "$base/programs/$file"
            done
            test ! -e "$base/desktop-games.js"
            test ! -e "$base/desktop-games-suite.js"
            test ! -e "$base/desktop-age-war.js"
            test ! -e "$base/desktop-shell.js"
          done
          if grep -Eq 'desktop-(games|games-suite|age-war|shell)\.js' docs/index.html; then
            echo "docs/index.html references legacy desktop scripts."
            exit 1
          fi
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find assets/javascript docs/assets/javascript -type f -name "*.js" -print0)

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
