<script>window.PORTFOLIO_ROOT="..";</script>

<script>
(()=>{
  const root=document.querySelector('[data-creations-client]');
  if(!root)return;
  const grid=root.querySelector('[data-creations-list]');
  const items=[...grid.querySelectorAll('.creation-folder-item')];
  const search=root.querySelector('[data-creations-search]');
  const feature=root.querySelector('[data-creations-feature]');
  const sort=root.querySelector('[data-creations-sort]');
  const empty=root.querySelector('[data-creations-empty]');
  const inspector=root.querySelector('[data-creation-inspector]');
  const inspectorLogo=root.querySelector('[data-creation-inspector-logo]');
  const inspectorTitle=root.querySelector('[data-creation-inspector-title]');
  const inspectorDescription=root.querySelector('[data-creation-inspector-description]');
  const inspectorCapabilities=root.querySelector('[data-creation-inspector-capabilities]');
  const inspectorUpdated=root.querySelector('[data-creation-inspector-updated]');
  const inspectorOpen=root.querySelector('[data-creation-inspector-open]');
  const viewButtons=[...root.querySelectorAll('[data-creations-view]')];
  let selected=null;

  const formatDate=(stamp)=>{
    const date=new Date(Number(stamp)||0);
    if(Number.isNaN(date.getTime())||!Number(stamp))return 'Unknown';
    return new Intl.DateTimeFormat(undefined,{day:'2-digit',month:'short',year:'numeric'}).format(date);
  };
  const openItem=(item)=>{
    if(!item)return;
    const appId=item.dataset.appId;
    if(appId&&window.parent!==window){
      window.parent.postMessage({type:'portfolio-open-app',app:appId},location.origin);
      return;
    }
    const href=item.dataset.href;
    if(!href)return;
    if(appId)window.open(href,'_blank','noopener,noreferrer');
    else location.href=href;
  };
  const clearSelection=()=>{
    selected=null;
    for(const item of items)item.classList.remove('is-selected');
    if(inspector)inspector.hidden=true;
    root.classList.remove('has-creation-inspector');
  };
  const selectItem=(item)=>{
    selected=item;
    for(const candidate of items)candidate.classList.toggle('is-selected',candidate===item);
    if(inspectorLogo){inspectorLogo.onerror=()=>{inspectorLogo.onerror=null;inspectorLogo.src='../assets/icons/pompompurin-loading.webp';};inspectorLogo.src=item.dataset.logo||'../assets/icons/pompompurin-loading.webp';inspectorLogo.alt='';}
    if(inspectorTitle)inspectorTitle.textContent=item.dataset.title||'Creation';
    if(inspectorDescription)inspectorDescription.textContent=item.dataset.description||'';
    if(inspectorCapabilities){
      inspectorCapabilities.replaceChildren();
      const capabilities=[];
      if(item.dataset.filterGenerator==='true')capabilities.push('Generator');
      if(item.dataset.filterVideo==='true')capabilities.push('Video');
      if(item.dataset.filterWorkshop==='true')capabilities.push('Workshop Content');
      for(const capability of capabilities){
        const badge=document.createElement('span');
        badge.textContent=capability;
        inspectorCapabilities.append(badge);
      }
      inspectorCapabilities.hidden=capabilities.length===0;
    }
    if(inspectorUpdated)inspectorUpdated.textContent=formatDate(item.dataset.lastUpdated);
    if(inspector)inspector.hidden=false;
    root.classList.add('has-creation-inspector');
  };
  const matches=(item)=>{
    const needle=(search?.value||'').trim().toLowerCase();
    if(needle&&!item.dataset.searchText.toLowerCase().includes(needle))return false;
    const filter=feature?.value||'all';
    if(filter==='generator'&&item.dataset.filterGenerator!=='true')return false;
    if(filter==='video'&&item.dataset.filterVideo!=='true')return false;
    if(filter==='workshop'&&item.dataset.filterWorkshop!=='true')return false;
    if(filter==='recent'&&item.dataset.filterRecent!=='true')return false;
    return true;
  };
  const apply=()=>{
    const visible=items.filter(matches);
    const ordered=[...visible].sort((a,b)=>{
      const pinnedA=a.dataset.pinnedFirst==='true';
      const pinnedB=b.dataset.pinnedFirst==='true';
      if(pinnedA!==pinnedB)return pinnedA?-1:1;
      return sort?.value==='name'?(a.dataset.title||'').localeCompare(b.dataset.title||''):(Number(b.dataset.lastUpdated)||0)-(Number(a.dataset.lastUpdated)||0)||(a.dataset.title||'').localeCompare(b.dataset.title||'');
    });
    for(const item of items)item.hidden=true;
    for(const item of ordered){item.hidden=false;grid.append(item);}
    if(empty)empty.hidden=visible.length!==0;
    if(selected&&selected.hidden)clearSelection();
  };

  grid.addEventListener('click',(event)=>{
    const item=event.target instanceof Element?event.target.closest('.creation-folder-item'):null;
    if(item)selectItem(item);
    else clearSelection();
  });
  grid.addEventListener('dblclick',(event)=>{
    const item=event.target instanceof Element?event.target.closest('.creation-folder-item'):null;
    if(item)openItem(item);
  });
  grid.addEventListener('keydown',(event)=>{
    const item=event.target instanceof Element?event.target.closest('.creation-folder-item'):null;
    if(!item)return;
    if(event.key==='Enter'){event.preventDefault();openItem(item);}
    if(event.key===' '){event.preventDefault();selectItem(item);}
  });
  inspectorOpen?.addEventListener('click',()=>openItem(selected));
  search?.addEventListener('input',apply);
  feature?.addEventListener('change',apply);
  sort?.addEventListener('change',apply);
  for(const button of viewButtons){
    button.addEventListener('click',()=>{
      const view=button.dataset.creationsView||'grid';
      grid.classList.toggle('is-list',view==='list');
      for(const candidate of viewButtons)candidate.setAttribute('aria-pressed',String(candidate===button));
    });
  }
  const requested=new URLSearchParams(location.search).get('filter');
  if(feature&&['generator','video','workshop','recent'].includes(requested))feature.value=requested;
  apply();
})();
</script>
